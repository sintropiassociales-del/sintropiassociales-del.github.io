<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Sintropía Social</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --purple: #631EEB;
  --purple-light: rgba(99,30,235,.12);
  --orange: #FF7929;
  --bg: #f5f4fb;
  --bg-card: #ffffff;
  --fg: #1a1630;
  --fg-muted: #6b6680;
  --line: rgba(99,30,235,.15);
  --green: #16a34a;
  --red: #dc2626;
  --yellow: #d97706;
  --r: 12px;
  --shadow: 0 2px 12px rgba(99,30,235,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0d1a; --bg-card: #1a1630; --fg: #ede8ff;
    --fg-muted: #9d94c0; --line: rgba(99,30,235,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0d1a; --bg-card: #1a1630; --fg: #ede8ff;
  --fg-muted: #9d94c0; --line: rgba(99,30,235,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

/* ── LOGIN ── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
.login-card {
  background: var(--bg-card); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 40px 36px; width: 100%; max-width: 400px;
  border: 1px solid var(--line);
}
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.login-logo svg { width: 32px; height: 32px; }
.login-logo span { font-size: 1rem; font-weight: 700; color: var(--purple); }
.login-card h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
.login-card p { font-size: .85rem; color: var(--fg-muted); margin-bottom: 24px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: .78rem; font-weight: 600; color: var(--fg-muted); margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase; }
.field input {
  width: 100%; padding: .6rem .85rem; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  font-family: inherit; font-size: .9rem; outline: none; transition: border .2s;
}
.field input:focus { border-color: var(--purple); }
.btn-primary {
  width: 100%; padding: .7rem 1rem; background: var(--purple); color: #fff;
  border: none; border-radius: 8px; font-family: inherit; font-size: .9rem;
  font-weight: 600; cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .88; }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.error-msg { background: rgba(220,38,38,.1); border: 1px solid rgba(220,38,38,.3); color: var(--red); border-radius: 8px; padding: .6rem .85rem; font-size: .84rem; margin-bottom: 14px; display: none; }
.divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--fg-muted); font-size: .78rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.btn-google {
  width: 100%; padding: .65rem 1rem; background: var(--bg-card); color: var(--fg);
  border: 1.5px solid var(--line); border-radius: 8px; font-family: inherit; font-size: .9rem;
  font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 10px; transition: background .15s, border-color .15s; margin-bottom: 2px;
}
.btn-google:hover { background: var(--bg); border-color: var(--purple); }
.btn-google:disabled { opacity: .5; cursor: not-allowed; }
.btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ── PANEL ── */
#panel { display: none; }
.topbar {
  background: var(--bg-card); border-bottom: 1px solid var(--line);
  padding: 0 24px; height: 60px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.topbar-left span { font-size: .78rem; color: var(--fg-muted); }
.topbar-badge {
  background: var(--purple-light); color: var(--purple);
  font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 50px;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.btn-sm {
  padding: .38rem .85rem; border-radius: 7px; font-family: inherit; font-size: .8rem;
  font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent;
  color: var(--fg); transition: background .15s;
}
.btn-sm:hover { background: var(--line); }
.btn-danger { border-color: rgba(220,38,38,.3); color: var(--red); }
.btn-danger:hover { background: rgba(220,38,38,.08); }

.main { padding: 28px 24px; max-width: 1100px; margin: 0 auto; }
.section-title {
  font-size: 1.1rem; font-weight: 700; margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.badge-count {
  background: var(--orange); color: #fff; font-size: .72rem;
  font-weight: 700; padding: 2px 8px; border-radius: 50px; min-width: 24px; text-align: center;
}

/* ── TABS ── */
.tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
.tab {
  padding: .55rem 1.1rem; font-family: inherit; font-size: .85rem; font-weight: 600;
  cursor: pointer; border: none; background: transparent; color: var(--fg-muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s;
}
.tab.active { color: var(--purple); border-bottom-color: var(--purple); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── CITA CARD ── */
.cita-card {
  background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; margin-bottom: 14px; transition: box-shadow .15s;
}
.cita-card:hover { box-shadow: var(--shadow); }
.cita-meta {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px;
}
.tag {
  font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 50px;
  background: var(--purple-light); color: var(--purple);
}
.tag-user { background: rgba(255,121,41,.12); color: var(--orange); }
.tag-date { background: var(--bg); color: var(--fg-muted); border: 1px solid var(--line); }
.cita-text {
  font-size: .88rem; line-height: 1.6; color: var(--fg); margin-bottom: 12px;
  padding: 10px 14px; background: var(--bg); border-radius: 8px; border-left: 3px solid var(--purple);
}
.cita-apa { font-size: .78rem; color: var(--fg-muted); margin-bottom: 14px; font-style: italic; }
.cita-fields {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
  margin-bottom: 14px;
}
.cita-field { font-size: .78rem; }
.cita-field strong { display: block; color: var(--fg-muted); font-weight: 600; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.cita-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-aprobar {
  padding: .45rem 1.1rem; background: var(--green); color: #fff; border: none;
  border-radius: 7px; font-family: inherit; font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.btn-aprobar:hover { opacity: .85; }
.btn-rechazar {
  padding: .45rem 1.1rem; background: transparent; color: var(--red);
  border: 1px solid rgba(220,38,38,.35); border-radius: 7px;
  font-family: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; transition: background .15s;
}
.btn-rechazar:hover { background: rgba(220,38,38,.08); }
.btn-editar {
  padding: .45rem 1.1rem; background: transparent; color: var(--fg-muted);
  border: 1px solid var(--line); border-radius: 7px;
  font-family: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; transition: background .15s;
}
.btn-editar:hover { background: var(--line); }
.rechazo-input {
  width: 100%; padding: .45rem .75rem; border-radius: 7px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font-family: inherit; font-size: .82rem;
  margin-top: 8px; display: none; outline: none;
}
.rechazo-input:focus { border-color: var(--red); }
.status-aprobada { color: var(--green); font-size: .78rem; font-weight: 700; }
.status-rechazada { color: var(--red); font-size: .78rem; font-weight: 700; }

/* ── ESTADO VACÍO / LOADING ── */
.empty { text-align: center; padding: 48px 24px; color: var(--fg-muted); font-size: .9rem; }
.empty svg { width: 48px; height: 48px; opacity: .3; margin: 0 auto 12px; display: block; }
.loading-bar {
  width: 100%; height: 3px; background: var(--line); border-radius: 2px;
  overflow: hidden; margin-bottom: 24px;
}
.loading-bar::after {
  content: ''; display: block; height: 100%; width: 40%;
  background: var(--purple); border-radius: 2px;
  animation: slide 1.2s ease-in-out infinite;
}
@keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--fg);
  color: var(--bg); padding: .7rem 1.2rem; border-radius: 9px; font-size: .85rem;
  font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 999;
  max-width: 320px;
}
#toast.show { opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .topbar { padding: 0 16px; }
  .main { padding: 20px 16px; }
  .cita-fields { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- ════════════════════════════════ LOGIN ════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="#631EEB" stroke-width="2.5"/>
        <path d="M10 16 Q16 8 22 16 Q16 24 10 16Z" fill="#631EEB" opacity=".7"/>
      </svg>
      <span>Sintropía Social</span>

    <!-- Botón Google -->
    <button type="button" class="btn-google" id="btn-google" onclick="iniciarGoogle()">
      <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z"/>

</div>

<!-- ════════════════════════════════ PANEL ════════════════════════════════ -->
<div id="panel">
  <div class="topbar">
    <div class="topbar-left">
      <strong style="font-size:.9rem;">Panel Admin</strong>
      <span id="adm-email-display"></span>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="btn-sm">← Sitio</a>

  <div class="main">

      <div id="lista-rechazadas"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  SEGURIDAD: Sanitización contra inyección de fórmulas en Sheets
//  Cualquier valor que empiece con = + - @ es un vector de ataque
// ══════════════════════════════════════════════════════════════════════
function sanitize(val) {
  if (val === null || val === undefined) return '';
  var s = String(val).trim();
  // Bloquea fórmulas de Sheets / CSV injection
  if (/^[=+\-@\t\r\n|]/.test(s)) s = "'" + s;
  // Elimina caracteres de control excepto salto de línea normal
  s = s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
  return s;
}

// Escapa HTML para renderizar texto sin riesgo de XSS
function escHtml(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function fmt(val) { return escHtml(sanitize(val)); }
function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleString('es-MX', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return escHtml(String(iso).substring(0,16)); }
}

// ══════════════════════════════════════════════════════════════════════
//  GOOGLE LOGIN
// ══════════════════════════════════════════════════════════════════════
var GOOGLE_CLIENT_ID = '778086289246-k0np3tkn92ubktvagff2hnohdveg8bgj.apps.googleusercontent.com';

function iniciarGoogle() {
  var btn = document.getElementById('btn-google');
  var errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span style="opacity:.6">Conectando con Google…</span>';

  if (typeof google === 'undefined' || !google.accounts) {
    errEl.textContent = 'Google no disponible. Recarga la página e intenta de nuevo.';
    errEl.style.display = 'block';
    resetBtnGoogle();
    return;
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: function(response) {
      if (!response || !response.credential) {
        errEl.textContent = 'No se recibió credencial de Google.';
        errEl.style.display = 'block';
        resetBtnGoogle();
        return;
      }
      // Decodifica el JWT para extraer el email (solo cliente, sin verificar firma)
      var parts = response.credential.split('.');
      var payload = {};
      try { payload = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/'))); } catch(e) {}
      var emailGoogle = (payload.email || '').toLowerCase().trim();

      // Llama loginAdmin con el idToken de Google (el backend lo verifica)
      api('loginAdmin', { googleIdToken: response.credential, email: emailGoogle })
        .then(function(res) {
          if (res && res.ok && res.token) {
            adminToken = res.token;
            storeToken(res.token, emailGoogle);
            mostrarPanel(emailGoogle);
          } else {
            errEl.textContent = res && res.error ? res.error : 'No autorizado. Verifica que tu cuenta esté habilitada como admin.';
            errEl.style.display = 'block';
            resetBtnGoogle();
          }
        }).catch(function() {
          errEl.textContent = 'Error de conexión con el servidor.';
          errEl.style.display = 'block';
          resetBtnGoogle();
        });
    },
    auto_select: false,
    cancel_on_tap_outside: true
  });

  google.accounts.id.prompt(function(notification) {
    // Si el usuario cancela el One Tap, volvemos al botón
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      // Fallback: abre el flujo de popup
      google.accounts.id.renderButton(
        document.getElementById('btn-google'),
        { type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', width: 340 }
      );
      resetBtnGoogle();
    }
  });
}

function resetBtnGoogle() {
  var btn = document.getElementById('btn-google');
  if (!btn) return;
  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58Z"/></svg> Entrar con Google';
}

// ══════════════════════════════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════════════════════════════
var adminToken = null;

function getStoredToken() {
  try { var a = JSON.parse(localStorage.getItem('ss_admin') || 'null'); return a && a.token ? a.token : null; }
  catch(e) { return null; }
}
function storeToken(t, email) {
  try { localStorage.setItem('ss_admin', JSON.stringify({ token: t, email: email, ts: Date.now() })); }
  catch(e) {}
}
function clearToken() {
  try { localStorage.removeItem('ss_admin'); } catch(e) {}
  adminToken = null;
}
function logout() { clearToken(); location.reload(); }

// ══════════════════════════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════════════════════════
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var emailRaw = document.getElementById('adm-email').value.trim().toLowerCase();
  var passRaw  = document.getElementById('adm-pass').value;
  var btn      = document.getElementById('login-btn');
  var errEl    = document.getElementById('login-error');

  // Validación básica anti-inyección en login
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailRaw)) {
    errEl.textContent = 'Correo inválido'; errEl.style.display = 'block'; return;
  }
  if (passRaw.length < 4 || passRaw.length > 128) {
    errEl.textContent = 'Contraseña inválida'; errEl.style.display = 'block'; return;
  }

  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Verificando…';

  try {
    var passHash = await sha256(passRaw);
    var res = await api('loginAdmin', { email: emailRaw, passHash: passHash });
    if (res && res.ok && res.token) {
      adminToken = res.token;
      storeToken(res.token, emailRaw);
      mostrarPanel(emailRaw);
    } else {
      errEl.textContent = res && res.error ? res.error : 'Credenciales incorrectas';
      errEl.style.display = 'block';
    }
  } catch(err) {
    errEl.textContent = 'Error de conexión con el servidor';
    errEl.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Entrar al panel';
});

function mostrarPanel(email) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('adm-email-display').textContent = email || '';
  cargarPendientes();
}

// ══════════════════════════════════════════════════════════════════════
//  TABS
// ══════════════════════════════════════════════════════════════════════
var tabsLoaded = {};
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('active', ['pendientes','aprobadas','rechazadas'][i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  if (!tabsLoaded[name]) {
    if (name === 'aprobadas')  cargarPorEstado('APROBADA',  'aprobadas');
    if (name === 'rechazadas') cargarPorEstado('RECHAZADA', 'rechazadas');
  }
}

// ══════════════════════════════════════════════════════════════════════
//  CARGAR CITAS
// ══════════════════════════════════════════════════════════════════════
function cargarPendientes() {
  var el = document.getElementById('lista-pendientes');
  var lb = document.getElementById('loading-pendientes');
  el.innerHTML = ''; lb.style.display = 'block';
  api('getPendientes', { adminToken: adminToken }).then(function(res) {
    lb.style.display = 'none';
    if (!res || !res.ok) { el.innerHTML = '<div class="empty">Error al cargar: ' + escHtml(res && res.error || 'Sin respuesta') + '</div>'; return; }
    var citas = (res.citas || []).filter(function(c){ return String(c.Estado||'').toUpperCase() === 'PENDIENTE'; });
    document.getElementById('badge-pendientes').textContent = citas.length;
    if (!citas.length) { el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>No hay citas pendientes — todo al día.</div>'; return; }
    el.innerHTML = citas.map(function(c, i) { return renderCitaCard(c, i, 'pendiente'); }).join('');
  }).catch(function(){ lb.style.display='none'; el.innerHTML='<div class="empty">Error de conexión.</div>'; });
}

function cargarPorEstado(estado, tabName) {
  tabsLoaded[tabName] = true;
  var el = document.getElementById('lista-' + tabName);
  var lb = document.getElementById('loading-' + tabName);
  el.innerHTML = ''; lb.style.display = 'block';
  api('getCitasPendientes', { adminToken: adminToken, estado: estado }).then(function(res) {
    lb.style.display = 'none';
    if (!res || !res.ok) { el.innerHTML = '<div class="empty">Error: ' + escHtml(res && res.error || '') + '</div>'; return; }
    var citas = res.citas || [];
    if (!citas.length) { el.innerHTML = '<div class="empty">Sin registros.</div>'; return; }
    el.innerHTML = citas.map(function(c, i) { return renderCitaCard(c, i, tabName); }).join('');
  }).catch(function(){ lb.style.display='none'; el.innerHTML='<div class="empty">Error de conexión.</div>'; });
}

// ══════════════════════════════════════════════════════════════════════
//  RENDER CARD — Todo el contenido pasa por fmt() / escHtml()
// ══════════════════════════════════════════════════════════════════════
function renderCitaCard(c, i, tipo) {
  var usuario = fmt(c.Usuario) || '<em style="opacity:.5">anónimo</em>';
  var estado  = String(c.Estado || 'PENDIENTE').toUpperCase();
  var rowNum  = c._rowNum || c.No || (i + 2); // número de fila real en Sheets
  var idCita  = 'cita-' + tipo + '-' + i;

  var estadoHtml = '';
  if (estado === 'APROBADA')   estadoHtml = '<span class="status-aprobada">✓ Aprobada</span>';
  if (estado.startsWith('RECHAZADA')) estadoHtml = '<span class="status-rechazada">✗ ' + escHtml(estado) + '</span>';

  var accionesHtml = '';
  if (tipo === 'pendiente') {
    accionesHtml = `
      <div class="cita-actions">
        <button class="btn-aprobar" onclick="aprobar(${i}, ${rowNum}, '${idCita}')">✓ Aprobar</button>
        <button class="btn-rechazar" onclick="toggleRechazo('rechInput-${idCita}')">✗ Rechazar</button>
        <input class="rechazo-input" id="rechInput-${idCita}" placeholder="Motivo (opcional) — Enter para rechazar"
          onkeydown="if(event.key==='Enter'){rechazar(${i}, ${rowNum}, '${idCita}', this.value);}">
      </div>`;
  } else {
    accionesHtml = '<div style="margin-top:4px;">' + estadoHtml + '</div>';
  }

  return `
    <div class="cita-card" id="${escHtml(idCita)}">
      <div class="cita-meta">
        <span class="tag">${fmt(c.Categoria) || 'Sin categoría'}</span>
        ${c.Indicador ? '<span class="tag">' + fmt(c.Indicador) + '</span>' : ''}
        <span class="tag tag-user">👤 ${usuario}</span>
        ${c.Fecha ? '<span class="tag tag-date">' + fmtDate(c.Fecha) + '</span>' : ''}
      </div>
      <div class="cita-text">${fmt(c.Cita) || '<em>Sin texto</em>'}</div>
      ${c['Cita Apa'] ? '<div class="cita-apa">' + fmt(c['Cita Apa']) + '</div>' : ''}
      <div class="cita-fields">
        ${c.Autor      ? '<div class="cita-field"><strong>Autor</strong>' + fmt(c.Autor) + '</div>' : ''}
        ${c.Anio       ? '<div class="cita-field"><strong>Año</strong>'   + fmt(c.Anio)  + '</div>' : ''}
        ${c.Publicacion? '<div class="cita-field"><strong>Publicación</strong>' + fmt(c.Publicacion) + '</div>' : ''}
        ${c.Pagina     ? '<div class="cita-field"><strong>Página</strong>' + fmt(c.Pagina) + '</div>' : ''}
        ${c.Poblacion  ? '<div class="cita-field"><strong>Población</strong>' + fmt(c.Poblacion) + '</div>' : ''}
        ${c.Link       ? '<div class="cita-field"><strong>Link</strong><a href="' + escHtml(c.Link) + '" target="_blank" rel="noopener noreferrer">' + fmt(c.Link).substring(0,40) + '…</a></div>' : ''}
        ${c.Comentarios? '<div class="cita-field"><strong>Comentarios</strong>' + fmt(c.Comentarios) + '</div>' : ''}
      </div>
      ${accionesHtml}
    </div>`;
}

function toggleRechazo(inputId) {
  var el = document.getElementById(inputId);
  if (!el) return;
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  if (el.style.display === 'block') el.focus();
}

// ══════════════════════════════════════════════════════════════════════
//  ACCIONES ADMIN
// ══════════════════════════════════════════════════════════════════════
function aprobar(idx, rowNum, cardId) {
  var card = document.getElementById(cardId);
  if (card) card.style.opacity = '.5';
  api('aprobarCita', { adminToken: adminToken, id: rowNum }).then(function(res) {
    if (res && res.ok) {
      toast('✓ Cita aprobada y publicada en el repositorio', 'ok');
      if (card) card.remove();
      var badge = document.getElementById('badge-pendientes');
      if (badge) badge.textContent = Math.max(0, parseInt(badge.textContent || '0') - 1);
      tabsLoaded['aprobadas'] = false; // forza recarga
    } else {
      toast('Error: ' + (res && res.error || 'Sin respuesta'), 'err');
      if (card) card.style.opacity = '1';
    }
  });
}

function rechazar(idx, rowNum, cardId, motivoRaw) {
  // Sanitiza el motivo antes de enviarlo
  var motivo = sanitize(motivoRaw || '');
  var card = document.getElementById(cardId);
  if (card) card.style.opacity = '.5';
  api('rechazarCita', { adminToken: adminToken, id: rowNum, motivo: motivo }).then(function(res) {
    if (res && res.ok) {
      toast('Cita rechazada', 'ok');
      if (card) card.remove();
      var badge = document.getElementById('badge-pendientes');
      if (badge) badge.textContent = Math.max(0, parseInt(badge.textContent || '0') - 1);
      tabsLoaded['rechazadas'] = false;
    } else {
      toast('Error: ' + (res && res.error || 'Sin respuesta'), 'err');
      if (card) card.style.opacity = '1';
    }
  });
}

// ══════════════════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════════════════
var _toastTimer;
function toast(msg, tipo) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = tipo === 'err' ? '#dc2626' : '#1a1630';
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

// ══════════════════════════════════════════════════════════════════════
//  INIT — revisa si ya hay sesión guardada
// ══════════════════════════════════════════════════════════════════════
(function init() {
  var stored = getStoredToken();
  if (stored) {
    // Verifica que el token siga válido
    api('getPendientes', { adminToken: stored }).then(function(res) {
      if (res && res.ok) {
        adminToken = stored;
        var adm = null;
        try { adm = JSON.parse(localStorage.getItem('ss_admin') || 'null'); } catch(e) {}
        mostrarPanel(adm && adm.email ? adm.email : '');
      }
      // Si no es válido, muestra login (ya está visible por defecto)
    });
  }
})();
</script>
